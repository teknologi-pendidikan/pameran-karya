variables:
  # Node.js and pnpm versions
  NODE_VERSION: "24"
  PNPM_VERSION: "10.26.2"

stages:
  - setup
  - lint
  - test
  - build
  - secret-detection

# Cache configuration for faster builds
.cache: &cache_config
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - apps/web-exhibition/node_modules/
      - apps/web-backoffice/node_modules/
      - .pnpm-store/

# Base job template
.base_job:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache git
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  <<: *cache_config

# Setup stage - install dependencies
setup:dependencies:
  extends: .base_job
  stage: setup
  script:
    - echo "Dependencies installed successfully"
    - pnpm list --depth=0
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/
      - apps/web-exhibition/node_modules/
      - apps/web-backoffice/node_modules/
      - .pnpm-store/

# Lint stage
lint:exhibition:
  extends: .base_job
  stage: lint
  needs:
    - setup:dependencies
  script:
    - echo "Linting web-exhibition app..."
    - pnpm --filter web-exhibition lint
  allow_failure: true

lint:backoffice:
  extends: .base_job
  stage: lint
  needs:
    - setup:dependencies
  script:
    - echo "Linting web-backoffice app..."
    - pnpm --filter web-backoffice lint
  allow_failure: true

# Test stage
test:exhibition:
  extends: .base_job
  stage: test
  needs:
    - setup:dependencies
    - lint:exhibition
  script:
    - echo "Running tests for web-exhibition app..."
    - pnpm --filter web-exhibition test:ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/web-exhibition/coverage/cobertura-coverage.xml
      junit: apps/web-exhibition/coverage/junit.xml
    paths:
      - apps/web-exhibition/coverage/
    when: always

test:backoffice:
  extends: .base_job
  stage: test
  needs:
    - setup:dependencies
  script:
    - echo "Web-backoffice app tests not configured yet"
    - echo "Skipping tests for web-backoffice"
  allow_failure: true

# Type checking
test:typecheck:exhibition:
  extends: .base_job
  stage: test
  needs:
    - setup:dependencies
  script:
    - echo "Type checking web-exhibition app..."
    - cd apps/web-exhibition
    - pnpm run typegen:build
  allow_failure: true

test:typecheck:backoffice:
  extends: .base_job
  stage: test
  needs:
    - setup:dependencies
  script:
    - echo "Type checking web-backoffice app..."
    - cd apps/web-backoffice
    - pnpm tsc --noEmit
  allow_failure: true

# Build stage (optional - for verification)
build:exhibition:
  extends: .base_job
  stage: build
  needs:
    - test:exhibition
  variables:
    NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY
  script:
    - echo "Building web-exhibition app..."
    - pnpm --filter web-exhibition build
  artifacts:
    expire_in: 1 day
    paths:
      - apps/web-exhibition/out/
  only:
    - "2025"

build:backoffice:
  extends: .base_job
  stage: build
  needs:
    - test:backoffice
    - lint:backoffice
  variables:
    NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
  script:
    - echo "Building web-backoffice app..."
    - pnpm --filter web-backoffice build
  artifacts:
    expire_in: 1 day
    paths:
      - apps/web-backoffice/.next/
  only:
    - "2025"

# Security scanning
secret_detection:
  stage: secret-detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
