variables:
  # Node.js and pnpm versions
  NODE_VERSION: "24"
  PNPM_VERSION: "10.26.2"

stages:
  - setup
  - lint
  - test
  - build
  - secret-detection

# Cache configuration for faster builds
.cache: &cache_config
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - apps/web-exhibition/node_modules/
      - apps/web-backoffice/node_modules/
      - .pnpm-store/

# Base job template
.base_job:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache git
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  <<: *cache_config

# Setup stage - install dependencies
setup:dependencies:
  extends: .base_job
  stage: setup
  script:
    - echo "Dependencies installed successfully"
    - pnpm list --depth=0
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/
      - apps/web-exhibition/node_modules/
      - apps/web-backoffice/node_modules/
      - .pnpm-store/

# Lint stage
lint:exhibition:
  extends: .base_job
  stage: lint
  needs:
    - setup:dependencies
  script:
    - echo "Linting web-exhibition app..."
    - pnpm --filter web-exhibition lint
  allow_failure: true

lint:backoffice:
  extends: .base_job
  stage: lint
  needs:
    - setup:dependencies
  script:
    - echo "Linting web-backoffice app..."
    - pnpm --filter web-backoffice lint
  allow_failure: true

# Test stage
test:exhibition:
  extends: .base_job
  stage: test
  needs:
    - setup:dependencies
    - lint:exhibition
  script:
    - echo "Running tests for web-exhibition app..."
    - pnpm --filter web-exhibition test:ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/web-exhibition/coverage/cobertura-coverage.xml
      junit: apps/web-exhibition/coverage/junit.xml
    paths:
      - apps/web-exhibition/coverage/
    when: always

test:backoffice:
  extends: .base_job
  stage: test
  needs:
    - setup:dependencies
  script:
    - echo "Web-backoffice app tests not configured yet"
    - echo "Skipping tests for web-backoffice"
  allow_failure: true

# Type checking
test:typecheck:exhibition:
  extends: .base_job
  stage: test
  needs:
    - setup:dependencies
  script:
    - echo "Type checking web-exhibition app..."
    - cd apps/web-exhibition
    - pnpm run typegen:build
  allow_failure: true

test:typecheck:backoffice:
  extends: .base_job
  stage: test
  needs:
    - setup:dependencies
  script:
    - echo "Type checking web-backoffice app..."
    - cd apps/web-backoffice
    - pnpm tsc --noEmit
  allow_failure: true

# Bundle analysis and performance
test:bundle-analysis:exhibition:
  extends: .base_job
  stage: test
  needs:
    - setup:dependencies
  script:
    - echo "Analyzing bundle size for web-exhibition..."
    - cd apps/web-exhibition
    - pnpm run build
    - echo "Bundle analysis completed"
    - du -sh out/ | tee bundle-size.txt
    - find out/ -name "*.js" -exec wc -c {} + | sort -n | tail -10 | tee largest-files.txt
  artifacts:
    expire_in: 1 week
    paths:
      - apps/web-exhibition/bundle-size.txt
      - apps/web-exhibition/largest-files.txt
    reports:
      dotenv: apps/web-exhibition/bundle-report.env
  after_script:
    - cd apps/web-exhibition
    - echo "BUNDLE_SIZE=$(du -sb out/ | cut -f1)" > bundle-report.env
    - echo "JS_FILES_COUNT=$(find out/ -name '*.js' | wc -l)" >> bundle-report.env
  allow_failure: true

test:bundle-analysis:backoffice:
  extends: .base_job
  stage: test
  needs:
    - setup:dependencies
  script:
    - echo "Analyzing bundle size for web-backoffice..."
    - cd apps/web-backoffice
    - pnpm run build
    - echo "Bundle analysis completed"
    - du -sh .next/ | tee bundle-size.txt
    - find .next/ -name "*.js" -exec wc -c {} + | sort -n | tail -10 | tee largest-files.txt
  artifacts:
    expire_in: 1 week
    paths:
      - apps/web-backoffice/bundle-size.txt
      - apps/web-backoffice/largest-files.txt
    reports:
      dotenv: apps/web-backoffice/bundle-report.env
  after_script:
    - cd apps/web-backoffice
    - echo "BUNDLE_SIZE=$(du -sb .next/ | cut -f1)" > bundle-report.env
    - echo "JS_FILES_COUNT=$(find .next/ -name '*.js' | wc -l)" >> bundle-report.env
  allow_failure: true

# Security and dependency audit
test:security-audit:
  extends: .base_job
  stage: test
  needs:
    - setup:dependencies
  script:
    - echo "Running security audit..."
    - pnpm audit --prod
    - echo "Checking for outdated dependencies..."
    - pnpm outdated || true
  artifacts:
    expire_in: 1 week
    paths:
      - audit-report.txt
    reports:
      dotenv: security-report.env
  after_script:
    - pnpm audit --prod --json > audit-report.txt || true
    - echo "AUDIT_STATUS=completed" > security-report.env
  allow_failure: true

# Performance budget check
test:performance-budget:exhibition:
  extends: .base_job
  stage: test
  needs:
    - test:bundle-analysis:exhibition
  variables:
    MAX_BUNDLE_SIZE: "5242880" # 5MB in bytes
  script:
    - echo "Checking performance budget for web-exhibition..."
    - cd apps/web-exhibition
    - |
      if [ -f bundle-report.env ]; then
        source bundle-report.env
        if [ "$BUNDLE_SIZE" -gt "$MAX_BUNDLE_SIZE" ]; then
          echo "❌ Bundle size ($BUNDLE_SIZE bytes) exceeds budget ($MAX_BUNDLE_SIZE bytes)"
          exit 1
        else
          echo "✅ Bundle size ($BUNDLE_SIZE bytes) within budget ($MAX_BUNDLE_SIZE bytes)"
        fi
      else
        echo "⚠️  Bundle report not found, skipping budget check"
      fi
  allow_failure: true

test:performance-budget:backoffice:
  extends: .base_job
  stage: test
  needs:
    - test:bundle-analysis:backoffice
  variables:
    MAX_BUNDLE_SIZE: "10485760" # 10MB in bytes (larger for backoffice)
  script:
    - echo "Checking performance budget for web-backoffice..."
    - cd apps/web-backoffice
    - |
      if [ -f bundle-report.env ]; then
        source bundle-report.env
        if [ "$BUNDLE_SIZE" -gt "$MAX_BUNDLE_SIZE" ]; then
          echo "❌ Bundle size ($BUNDLE_SIZE bytes) exceeds budget ($MAX_BUNDLE_SIZE bytes)"
          exit 1
        else
          echo "✅ Bundle size ($BUNDLE_SIZE bytes) within budget ($MAX_BUNDLE_SIZE bytes)"
        fi
      else
        echo "⚠️  Bundle report not found, skipping budget check"
      fi
  allow_failure: true

# Build stage - verification only, deployments handled by platforms
build:exhibition:
  extends: .base_job
  stage: build
  needs:
    - test:exhibition
    - test:typecheck:exhibition
  variables:
    NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
  script:
    - echo "Building web-exhibition app for verification..."
    - echo "Validating environment variables..."
    - |
      if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
        echo "❌ NEXT_PUBLIC_SUPABASE_URL is not set or empty"
        exit 1
      fi
      if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
        echo "❌ NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is not set or empty"
        exit 1
      fi
      echo "✅ Environment variables validated"
      echo "SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:0:30}..."
      echo "SUPABASE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:0:30}..."
    - pnpm --filter web-exhibition build
    - echo "Build successful - ready for Netlify deployment"
  artifacts:
    expire_in: 1 day
    paths:
      - apps/web-exhibition/out/
    reports:
      dotenv: apps/web-exhibition/build-report.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "2025"'
      changes:
        - apps/web-exhibition/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
  after_script:
    - echo "BUILD_STATUS=success" > apps/web-exhibition/build-report.env
    - echo "BUILD_SIZE=$(du -sh apps/web-exhibition/out | cut -f1)" >> apps/web-exhibition/build-report.env

build:backoffice:
  extends: .base_job
  stage: build
  needs:
    - test:backoffice
    - test:typecheck:backoffice
    - lint:backoffice
  variables:
    NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
  script:
    - echo "Building web-backoffice app for verification..."
    - echo "Validating environment variables..."
    - |
      if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
        echo "❌ NEXT_PUBLIC_SUPABASE_URL is not set or empty"
        exit 1
      fi
      if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
        echo "❌ NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is not set or empty"
        exit 1
      fi
      echo "✅ Environment variables validated"
      echo "SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:0:30}..."
      echo "SUPABASE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:0:30}..."
    - pnpm --filter web-backoffice build
    - echo "Build successful - ready for Vercel deployment"
  artifacts:
    expire_in: 1 day
    paths:
      - apps/web-backoffice/.next/
    reports:
      dotenv: apps/web-backoffice/build-report.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "2025"'
      changes:
        - apps/web-backoffice/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
  after_script:
    - echo "BUILD_STATUS=success" > apps/web-backoffice/build-report.env
    - echo "BUILD_SIZE=$(du -sh apps/web-backoffice/.next | cut -f1)" >> apps/web-backoffice/build-report.env

# Security scanning
secret_detection:
  stage: secret-detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
