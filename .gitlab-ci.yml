variables:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.26.2"

stages:
  - test
  - build

# Base job template
.base_job:
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - apk add --no-cache git
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# Test and lint jobs
test:exhibition:
  extends: .base_job
  stage: test
  script:
    - echo "Linting and testing web-exhibition..."
    - pnpm --filter web-exhibition lint
    - pnpm --filter web-exhibition test:ci
    - cd apps/web-exhibition && pnpm tsc --noEmit
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    expire_in: 3 days
    reports:
      junit: apps/web-exhibition/coverage/junit.xml
    paths:
      - apps/web-exhibition/coverage/
    when: always

test:backoffice:
  extends: .base_job
  stage: test
  script:
    - echo "Linting and type-checking web-backoffice..."
    - pnpm --filter web-backoffice lint
    - cd apps/web-backoffice && pnpm tsc --noEmit
# Build jobs
build:exhibition:
  extends: .base_job
  stage: build
  needs: ["test:exhibition"]
  variables:
    NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
  script:
    - echo "Building web-exhibition..."
    - pnpm --filter web-exhibition build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "2025"'
      changes:
        - apps/web-exhibition/**/*
        - package.json
        - pnpm-lock.yaml

build:backoffice:
  extends: .base_job
  stage: build
  needs: ["test:backoffice"]
  variables:
    NEXT_PUBLIC_SUPABASE_URL: $NEXT_PUBLIC_SUPABASE_URL
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
  script:
    - echo "Building web-backoffice..."
    - pnpm --filter web-backoffice build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "2025"'
      changes:
        - apps/web-backoffice/**/*
        - package.json
        - pnpm-lock.yaml
