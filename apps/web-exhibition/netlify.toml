[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  # Base directory for the monorepo
  base = "apps/web-exhibition"
  # Build command that works from the root
  command = "cd ../.. && pnpm build:exhibition"
  # Output directory relative to base
  publish = "out"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/web-exhibition/"

[build.environment]
  # Enable pnpm
  NPM_FLAGS = "--version" # Prevent npm usage
  PNPM_VERSION = "10.26.2"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://cdn.jsdelivr.net/; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/; img-src 'self' blob: data: https://i.ytimg.com/ https://img.youtube.com/; frame-src https://www.youtube.com/ https://www.google.com/ https://www.youtube-nocookie.com/ https://docs.google.com/ https://calendar.google.com/ https://*.google.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; block-all-mixed-content;"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-DNS-Prefetch-Control = "on"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
